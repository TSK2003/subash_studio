name: CI & Hardening Pipeline

on:
  push:
    branches: [main, master, 'fix/**', 'release/**']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package.json
            backend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend (Production Rollup & Code Splitting)
        working-directory: ./frontend
        run: npm run build

      - name: Validate Prisma Schema
        working-directory: ./backend
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run Backend Automated Test Suite
        working-directory: ./backend
        run: npm test

      - name: Validate Backend Syntax
        working-directory: ./backend
        run: npm run lint
